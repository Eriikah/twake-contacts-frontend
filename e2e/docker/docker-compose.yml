# Backend of the e2e suite (e2e/scripts/start.sh, project `twake-contacts-e2e`) and of the QA
# environment (scripts/qa-environment/start.sh, project `twake-contacts-qa`): esn-sabre, the side
# service and what they need, Dex over OpenLDAP, the mock SMTP server, and the app under test.
# The images are built by e2e/scripts/build.sh.
#
# Adapted from the e2e stack of twake-calendar-frontend. Nothing is published on the host: the
# browser reaches the containers by their IP (Chromium --host-resolver-rules), which is why every
# browser facing URL (frontend/env.js, side-service/configuration.properties, dex/config.yaml) is
# a plain hostname: localhost:8099, api, dav, sso:5554.

networks:
  # The name is part of the QA tooling configuration (`<project>_tcalendar-e2e`)
  tcalendar-e2e:
    driver: bridge

services:
  frontend:
    image: ${E2E_APP_IMAGE:-twake-contacts-web-e2e}
    networks:
      tcalendar-e2e:
        aliases:
          - frontend
    depends_on:
      - proxy

  # Exposes the backend to the browser as http://api and http://dav, with CORS
  proxy:
    image: twake-contacts-e2e-proxy
    networks:
      tcalendar-e2e:
        aliases:
          - api
          - dav

  sso:
    image: twake-contacts-e2e-dex
    command: dex serve /etc/dex/config.yaml
    environment:
      - DEX_EXPAND_ENV=false
      - DEX_SESSIONS_ENABLED=true
    networks:
      tcalendar-e2e:
        aliases:
          - sso

  twake-calendar-side-service:
    image: twake-contacts-e2e-side-service
    depends_on:
      opensearch:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      ldap:
        condition: service_started
      sabre_dav:
        condition: service_started
      sso:
        condition: service_started
    networks:
      - tcalendar-e2e

  sabre_dav:
    hostname: esn_sabre
    image: twake-contacts-e2e-sabre
    environment:
      - SABRE_ENV=dev
      - SABRE_MONGO_HOST=mongo
      - SABRE_MONGO_PORT=27017
      - ESN_MONGO_HOST=mongo
      - ESN_MONGO_PORT=27017
      - ESN_MONGO_DBNAME=esn_docker
      - MONGO_TIMEOUT=100000
      - ESN_HOST=twake-calendar-side-service
      - ESN_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AMQP_HOST=rabbitmq
      - AMQP_PORT=5672
      - AMQP_LOGIN=guest
      - AMQP_PASSWORD=guest
      # e2e/support/dav.ts impersonates the users with these
      - SABRE_ADMIN_LOGIN=admin
      - SABRE_ADMIN_PASSWORD=secret123
      - OPENPASS_BASIC_AUTH=YWRtaW5Ab3Blbi1wYWFzLm9yZzpzZWNyZXQ=
      - LDAP_ADMIN_DN=cn=admin,dc=open-paas.org,dc=lng
      - LDAP_ADMIN_PASSWORD=admin
      - LDAP_BASE=ou=users,dc=open-paas.org,dc=lng
      - LDAP_BASE_WITH_MAIL=ou=users,dc=open-paas.org,dc=lng
      - LDAP_SERVER=ldap://esn_ldap:389
      - LDAP_USERNAME_MODE=username
      - LOG_TRACE=true
      - SABRE_IMPERSONATION_ENABLED=true
    networks:
      - tcalendar-e2e

  # Dex authenticates against it, and e2e/support/users.ts writes the test accounts to it
  ldap:
    hostname: esn_ldap
    image: twake-contacts-e2e-ldap
    environment:
      - LDAP_PORT_NUMBER=389
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=admin
      - LDAP_ROOT=dc=open-paas.org,dc=lng
    networks:
      - tcalendar-e2e

  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9200/_cluster/health']
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - tcalendar-e2e

  redis:
    image: redis:7.4.2
    networks:
      - tcalendar-e2e

  rabbitmq:
    image: rabbitmq:4.1.1-management
    networks:
      - tcalendar-e2e

  mongo:
    image: mongo:8.0.6
    networks:
      - tcalendar-e2e

  # The mails the backend sends (import reports), read back on its REST port 8000
  mock-smtp:
    image: linagora/mock-smtp-server:0.7
    networks:
      - tcalendar-e2e
